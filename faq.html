      var root = document.documentElement;
      var lang = localStorage.getItem('siteLang') || 'en';

  <script src="assets/js/language.js?v=weekly-hours-phone-1"></script>
  <script src="assets/js/color-lock.js?v=consistent-light-3"></script>

  <script>
(function () {
  var mq = window.matchMedia('(prefers-color-scheme: dark)');

  var badge = document.createElement('div');
  badge.style.cssText =
    'position:fixed;top:0;left:0;z-index:99999;padding:6px 10px;font:12px/1.4 monospace;' +
    'background:#000;color:#fff;max-width:100vw;white-space:pre;pointer-events:none';
  document.body.appendChild(badge);

  function update() {
    var mode = mq.matches ? 'DARK' : 'LIGHT';

    // Is your dark rule actually winning? Read an element it targets.
    var el = document.querySelector('.bg-periglacial-blue');
    var applied;
    if (!el) {
      applied = 'no .bg-periglacial-blue on page';
    } else {
      var bg = getComputedStyle(el).backgrou
      // dark rule sets #f5f8f9 => rgb(245, 248, 249)
      applied = (bg === 'rgb(245, 248, 249)')
        ? 'YES — dark rule applied'
        : 'no — light styles (bg=' + bg + ')';
    }

    badge.textContent =
      'prefers-color-scheme: ' + mode + '\n' +
      'dark CSS applied: ' + applied;
  }

  update();
  mq.addEventListener('change', update); // live-updates if you toggle OS dark mode
})();
</script>
</body>

</html>
